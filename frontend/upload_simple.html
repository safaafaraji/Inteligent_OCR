<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traitement OCR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold mb-8">Traitement OCR de documents</h1>
        
        <!-- Zone d'upload -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">1. Sélectionnez un document</h2>
            
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center mb-4"
                 id="dropZone"
                 ondrop="handleDrop(event)"
                 ondragover="handleDragOver(event)">
                <input type="file" id="fileInput" class="hidden" 
                       accept=".pdf,.jpg,.jpeg,.png,.tiff,.tif"
                       onchange="handleFileSelect()">
                
                <button onclick="document.getElementById('fileInput').click()"
                        class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 mb-4">
                    📁 Choisir un fichier
                </button>
                
                <p class="text-gray-600">ou glissez-déposez ici</p>
                <p class="text-sm text-gray-500 mt-2">
                    Formats supportés: PDF, JPG, PNG, TIFF (max 10MB)
                </p>
            </div>
            
            <div id="fileInfo" class="hidden">
                <p class="font-medium" id="fileName"></p>
                <p class="text-sm text-gray-500" id="fileSize"></p>
            </div>
        </div>
        
        <!-- Options -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">2. Options de traitement</h2>
            
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Langue:</label>
                <select id="language" class="border rounded-lg p-2 w-full">
                    <option value="fra+eng">Français + Anglais</option>
                    <option value="fra">Français</option>
                    <option value="eng">Anglais</option>
                    <option value="spa">Espagnol</option>
                </select>
            </div>
            
            <button onclick="processDocument()" 
                    id="processBtn"
                    class="bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600 w-full disabled:opacity-50"
                    disabled>
                🚀 Traiter le document
            </button>
        </div>
        
        <!-- Résultats -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">3. Résultats</h2>
            
            <div id="loading" class="hidden text-center py-8">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                <p class="mt-2 text-gray-600">Traitement en cours...</p>
            </div>
            
            <div id="results" class="hidden">
                <!-- Les résultats seront affichés ici -->
            </div>
            
            <div id="error" class="hidden text-red-600 p-4 bg-red-50 rounded-lg">
                <!-- Les erreurs seront affichées ici -->
            </div>
        </div>
    </div>
    
    <script>
        let selectedFile = null;
        
        // Gestion du drag & drop
        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.add('border-blue-500', 'bg-blue-50');
        }
        
        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.remove('border-blue-500', 'bg-blue-50');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }
        
        // Gestion de la sélection de fichier
        function handleFileSelect() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
        }
        
        function handleFile(file) {
            // Validation
            const allowedTypes = [
                'application/pdf',
                'image/jpeg',
                'image/jpg',
                'image/png',
                'image/tiff',
                'image/tif'
            ];
            
            if (!allowedTypes.includes(file.type) && 
                !file.name.match(/\.(pdf|jpg|jpeg|png|tiff|tif)$/i)) {
                showError('Format de fichier non supporté');
                return;
            }
            
            if (file.size > 10 * 1024 * 1024) { // 10MB
                showError('Fichier trop volumineux (max 10MB)');
                return;
            }
            
            selectedFile = file;
            
            // Afficher les infos du fichier
            document.getElementById('fileInfo').classList.remove('hidden');
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            
            // Activer le bouton de traitement
            document.getElementById('processBtn').disabled = false;
        }
        
        // Traitement du document
        async function processDocument() {
            if (!selectedFile) return;
            
            // Afficher le loader
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('language', document.getElementById('language').value);
            
            try {
                // Vérifier l'authentification
                let token = localStorage.getItem('ocr_token');
                
                // Si pas de token, utiliser les identifiants démo
                if (!token) {
                    const loginResponse = await fetch('http://localhost:8000/api/auth/login', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            username: 'demo',
                            password: 'demo123'
                        })
                    });
                    
                    if (!loginResponse.ok) {
                        throw new Error('Échec de l\'authentification');
                    }
                    
                    const loginData = await loginResponse.json();
                    token = loginData.access_token;
                    localStorage.setItem('ocr_token', token);
                }
                
                // Envoyer le fichier
                const response = await fetch('http://localhost:8000/api/ocr/extract', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Erreur de traitement');
                }
                
                const result = await response.json();
                displayResults(result);
                
            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }
        
        // Affichage des résultats
        function displayResults(result) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.classList.remove('hidden');
            
            resultsDiv.innerHTML = `
                <div class="mb-6 p-4 bg-green-50 rounded-lg">
                    <h3 class="text-lg font-semibold text-green-800">✅ Traitement réussi!</h3>
                    <p class="text-green-600">${result.filename}</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <p class="text-sm text-gray-500">Type de document</p>
                        <p class="font-medium">${result.document_type}</p>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <p class="text-sm text-gray-500">Confiance</p>
                        <p class="font-medium">${(result.confidence * 100).toFixed(1)}%</p>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <p class="text-sm text-gray-500">Pages</p>
                        <p class="font-medium">${result.pages}</p>
                    </div>
                </div>
                
                <div class="mb-6">
                    <h4 class="font-semibold mb-2">Texte extrait:</h4>
                    <div class="border rounded-lg p-4 bg-gray-50 max-h-96 overflow-y-auto">
                        <pre class="whitespace-pre-wrap">${result.text}</pre>
                    </div>
                </div>
                
                <div>
                    <h4 class="font-semibold mb-2">Données structurées:</h4>
                    <div class="border rounded-lg p-4 bg-gray-50">
                        <pre class="whitespace-pre-wrap">${JSON.stringify(result.structured_data, null, 2)}</pre>
                    </div>
                </div>
                
                <div class="mt-6 flex gap-4">
                    <button onclick="copyText('${escapeHtml(result.text)}')"
                            class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                        📋 Copier le texte
                    </button>
                    <button onclick="downloadJson(result)"
                            class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                        ⬇️ Télécharger JSON
                    </button>
                </div>
            `;
        }
        
        // Fonctions utilitaires
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.classList.remove('hidden');
            errorDiv.innerHTML = `
                <p class="font-semibold">❌ Erreur</p>
                <p>${message}</p>
            `;
        }
        
        function copyText(text) {
            navigator.clipboard.writeText(text)
                .then(() => alert('Texte copié dans le presse-papier!'))
                .catch(err => console.error('Erreur copie:', err));
        }
        
        function downloadJson(data) {
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ocr-result-${data.filename}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            console.log('OCR Interface prête');
        });
    </script>
</body>
</html>
